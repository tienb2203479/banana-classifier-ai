<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bananaSimple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- White background for contrast -->
  <rect width="100" height="100" fill="white"/>
  
  <!-- Bold banana shape -->
  <path d="M 20 70 Q 40 15 75 15 Q 88 15 86 48 Q 84 75 55 85 Q 30 92 20 85 Z" 
        fill="url(#bananaSimple)" stroke="#ca8a04" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Shadow/depth on right side -->
  <path d="M 20 70 Q 40 15 75 15 Q 88 15 86 48 Q 84 75 55 85 Q 30 92 20 85 Z" 
        fill="none" stroke="#b8860b" stroke-width="1" opacity="0.5" stroke-linejoin="round"/>
  
  <!-- Highlight -->
